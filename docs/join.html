<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join a crew on Some Wins</title>
<meta name="description" content="A quiet place to hold the good things, with a few people you love.">
<meta property="og:site_name" content="Some Wins">
<meta property="og:title" content="Some Wins">
<meta property="og:description" content="A quiet place to hold the good things, with a few people you love.">
<meta property="og:image" content="https://somewins.xyz/invite/logo.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/site/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/site/icon-192.png">
<link rel="apple-touch-icon" href="/site/icon-180.png">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="preload" href="site/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Inter, kept on the site itself (SIL Open Font License,
     site/fonts/Inter-OFL.txt), so a page asks nobody else for anything. */
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("site/fonts/Inter-latin.woff2") format("woff2"); }
  /* The app's own ground, ink and wordmark (Zen Maru Gothic, SIL Open Font
     License: invite/ZenMaruGothic-OFL.txt). */
  @font-face { font-family: "Zen Maru"; src: url("invite/ZenMaruGothic-Bold.ttf") format("truetype"); font-display: swap; }
  :root {
    --bg-top: #ffffff; --bg-bottom: #ffffff;
    --ink: #16171a; --ink-2: rgba(22,23,26,.70); --ink-3: rgba(22,23,26,.55);
    --fill: #16171a; --on-fill: #f6f7fa; --rule: rgba(22,23,26,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* The ground reaches under Safari's own bars: with none on `html` they
     were white round a dark page (seen on the live page, 2026-10-13). */
  html { background: #ffffff; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) no-repeat fixed;
    color: var(--ink);
    font: 400 17px/1.5 Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased; text-align: center;
  }
  .mark { display: flex; align-items: center; gap: 8px; font: 700 20px/1 "Zen Maru", ui-rounded, sans-serif; }
  /* His drawings are one black line: shown in the page's ink, as the app does. */
  .ink { background: var(--ink); -webkit-mask: var(--art) center / contain no-repeat; mask: var(--art) center / contain no-repeat; }
  .mark .ink { --art: url("invite/camera.png"); width: 26px; height: 25px; }
  main { flex: 1; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 0; }
  .art { position: relative; width: 100%; max-width: 300px; aspect-ratio: 3 / 2; margin-bottom: 20px; }
  .art .ink { position: absolute; inset: 0; }
  .art .crew { --art: url("invite/crew.png"); }
  .art .cheer { --art: url("invite/cheer.png"); }
  h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.02em; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--ink-2); margin: 0 0 28px; }
  a { color: inherit; -webkit-tap-highlight-color: transparent; }
  a.open {
    display: block; width: 100%; height: 50px; line-height: 50px; border-radius: 25px;
    background: var(--fill); color: var(--on-fill); text-decoration: none; font-weight: 600;
  }
  a.open:active { opacity: .8; }
  a.get {
    display: block; width: 100%; height: 50px; line-height: 48px; border-radius: 25px; margin-top: 12px;
    border: 1px solid var(--rule); text-decoration: none; font-weight: 600;
  }
  a.get:active { opacity: .6; }
  .note { font-size: 15px; color: var(--ink-3); margin: 20px 0 0; }
  #needs { margin-top: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="mark" aria-label="Some Wins"><span class="ink" aria-hidden="true"></span>Some Wins</div>
  <main>
    <div class="art" aria-hidden="true"><div class="ink crew"></div><div class="ink cheer"></div></div>
    <h1 id="title">You're invited to a crew</h1>
    <p id="line">One tower for the day, with the people you choose.</p>
    <a class="open" id="open" href="somewins://join">Open in Some Wins</a>
    <a class="get" id="get" href="https://testflight.apple.com/join/ZWQ5cHv6">Get Some Wins</a>
    <p class="note" id="note">New here, or it didn't open? Get Some Wins first, then open this link again.</p>
    <p class="note" id="needs">Crews need iOS 26.</p>
  </main>
<script>
  // The crew and its key travel after the # and never leave this page: a
  // browser does not send the fragment to any server. It is handed straight
  // to the app's own link.
  //
  // Nothing opens by itself. Sending a phone without the app (or with an
  // older build) straight to the app's link made Safari say the address is
  // invalid, which read as a broken invitation.
  (function () {
    var invite = location.hash.replace(/^#/, "");
    var open = document.getElementById("open");
    if (!/^crew-[0-9A-Fa-f-]{1,59}\.[A-Za-z0-9_-]{43}$/.test(invite)) {
      document.getElementById("title").textContent = "This invite is incomplete";
      document.getElementById("line").textContent = "Part of the link is missing. Ask your friend to send it again.";
      open.hidden = true;
      document.getElementById("note").hidden = true;
      return;
    }
    open.setAttribute("href", "somewins://join#" + invite);
    // Installing loses the link: the app starts fresh and nothing carries
    // the invitation across. This tab keeps it in its address, so the note
    // says to come back here, where the way in is one tap.
    document.getElementById("get").addEventListener("click", function () {
      document.getElementById("note").textContent = "Once it's installed, come back to this page and tap Open in Some Wins.";
    });
  })();
</script>
</body>
</html>
